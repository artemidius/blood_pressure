name: Android CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Git-ignored, separately licensed (AGPL-3.0) detector weights; see docs/SCANNER.md.
  # Published once as a release asset so CI can satisfy the verifyScannerModel preBuild check.
  MODEL_URL: https://github.com/artemidius/blood_pressure/releases/download/scanner-model-v1/detector.tflite

jobs:
  unit-tests:
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download scanner model
        run: curl -fL "$MODEL_URL" -o app/src/main/assets/seven-digits/detector.tflite
      - name: Restore google-services.json
        # The tracked file is a placeholder; the real Firebase config lives in this secret.
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
      - uses: gradle/actions/setup-gradle@v6
      - name: Ensure writable Android config directory
        # AGP creates the debug keystore and analytics settings here; a previous
        # sudo sdkmanager run can leave it root-owned.
        run: mkdir -p "$HOME/.config/.android"
      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore

  ui-tests:
    name: UI tests (Pixel 7, API 35)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Download scanner model
        run: curl -fL "$MODEL_URL" -o app/src/main/assets/seven-digits/detector.tflite
      - name: Restore google-services.json
        # The tracked file is a placeholder; the real Firebase config lives in this secret.
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: printf '%s' "$GOOGLE_SERVICES_JSON" > app/google-services.json
      - uses: gradle/actions/setup-gradle@v6
      - name: Ensure writable Android config directory
        # AGP creates the debug keystore and analytics settings here; a previous
        # sudo sdkmanager run can leave it root-owned.
        run: mkdir -p "$HOME/.config/.android"
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run instrumented UI tests on the Gradle managed device
        run: ./gradlew pixel7Api35DebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ui-test-reports
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
          if-no-files-found: ignore
