[versions]
activityCompose = "1.12.3"
agp = "9.5.1"
appcompat = "1.7.1"
composeBom = "2026.01.01"
connectClient = "1.1.0"
coreKtx = "1.17.0"
espressoCore = "3.7.0"
firebaseBom = "34.9.0"
firebaseUiAuth = "9.1.1"
googleServices = "4.4.4"
hilt = "2.59.1"
hiltAndroidCompilerVersion = "2.59.1"
junit = "4.13.2"
junitVersion = "1.3.0"
kotlin = "2.3.10"
ksp = "2.3.4"
lifecycleRuntimeKtx = "2.10.0"
lifecycleViewmodelCompose = "2.10.0"
mockk = "1.14.9"


[libraries]
androidx-exifinterface = { module = "androidx.exifinterface:exifinterface", version = "1.4.2" }
seven-segment-scanner = { module = "com.github.artemidius:7-segment-digits-Scanner", version = "v0.2.0-alpha.1" }
coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version = "1.11.0" }
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose            = { group  = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-appcompat                   = { module = "androidx.appcompat:appcompat", version.ref = "appcompat" }
androidx-compose-bom                 = { group  = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-connect-client              = { module = "androidx.health.connect:connect-client", version.ref = "connectClient" }
androidx-core-ktx                    = { group  = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-espresso-core               = { group  = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-junit                       = { group  = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-lifecycle-runtime-ktx       = { group  = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycleRuntimeKtx" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
androidx-material3                   = { group  = "androidx.compose.material3", name = "material3" }
androidx-ui                          = { group  = "androidx.compose.ui", name = "ui" }
androidx-ui-graphics                 = { group  = "androidx.compose.ui", name = "ui-graphics" }
androidx-ui-test-junit4              = { group  = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-ui-test-manifest            = { group  = "androidx.compose.ui", name = "ui-test-manifest" }
androidx-ui-tooling                  = { group  = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview          = { group  = "androidx.compose.ui", name = "ui-tooling-preview" }
compose-material-icons               = { group  = "androidx.compose.material", name = "material-icons-core" }
firebase-auth                        = { module = "com.google.firebase:firebase-auth" }
firebase-bom                         = { module = "com.google.firebase:firebase-bom", version.ref = "firebaseBom" }
firebase-firestore                   = { module = "com.google.firebase:firebase-firestore" }
firebase-ui-auth                     = { module = "com.firebaseui:firebase-ui-auth", version.ref = "firebaseUiAuth" }
hilt-android                         = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-android-compiler                = { module = "com.google.dagger:hilt-android-compiler", version.ref = "hiltAndroidCompilerVersion" }
junit                                = { group  = "junit", name = "junit", version.ref = "junit" }
mockk                                = { module = "io.mockk:mockk", version.ref = "mockk" }

[plugins]
android-application  = { id = "com.android.application", version.ref = "agp" }
google-services      = { id = "com.google.gms.google-services", version.ref = "googleServices" }
hilt                 = { id = "com.google.dagger.hilt.android", version.ref = "hilt" }
kotlin-android       = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-ksp           = { id = "com.google.devtools.ksp", version.ref = "ksp" }


